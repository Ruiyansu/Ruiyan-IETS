<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f5f1">
<title>Listening Studio — IELTS Studio</title>
<style>
:root{--bg:#f6f5f1;--paper:#fff;--ink:#252923;--muted:#7d8079;--line:#e9e8e2;--sage:#718779;--sage-light:#eaf0eb;--blue:#eaf0f5;--sand:#f3eee6;--lilac:#f1edf2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:30px 26px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;gap:11px;align-items:center;color:var(--ink);text-decoration:none}.mark{width:38px;height:38px;border-radius:11px;background:#29312c;color:#fff;display:grid;place-items:center;font:bold 21px Arial}.brand strong{display:block;letter-spacing:1.2px;font-size:12px}.brand small{display:block;color:#9a9c95;font-size:9px;letter-spacing:1px;margin-top:4px}.back{color:#536b5a;text-decoration:none;font-weight:700}.hero{padding:32px;border-radius:22px;background:linear-gradient(120deg,#e6eee7,#edf0ed 58%,#e9edf1);margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#7d8c80;font-weight:700}.hero h1{font-size:clamp(30px,5vw,44px);margin:9px 0;letter-spacing:-1.4px;text-shadow:0 2px 1px #d4ddd5}.hero p{color:#5f6a61;line-height:1.7;max-width:690px;margin:0}.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px}.stat strong{font-size:24px;display:block}.stat span{font-size:11px;color:#68736a}.section{display:flex;align-items:end;justify-content:space-between;margin:26px 0 12px}.section h2{font-size:18px;margin:0}.section p{color:var(--muted);font-size:12px;margin:0}.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.part{border:1px solid var(--line);background:#fff;border-radius:15px;padding:17px;text-align:left;cursor:pointer;transition:.16s;min-height:112px;color:var(--ink)}.part:hover{transform:translateY(-2px);border-color:#aab8ad}.part[aria-pressed=true]{outline:2px solid #839889;background:#eaf0eb}.part .num{font-size:10px;color:#8b9589;letter-spacing:1.4px;font-weight:700}.part strong{display:block;font-size:25px;margin:6px 0 1px}.part span{color:var(--muted);font-size:11px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:13px}.search{flex:1;min-width:190px;border:1px solid #e6e7e1;border-radius:10px;padding:11px 13px;font:inherit;outline:none}.search:focus{border-color:#8fa394}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid #e5e6df;background:#f8f8f5;color:#626b63;padding:9px 12px;border-radius:20px;cursor:pointer;font:inherit;font-size:12px}.filter[aria-pressed=true]{background:#e8eee9;border-color:#b7c5ba;color:#34483a;font-weight:700}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.test{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;transition:.15s}.test:hover{border-color:#aab8ad;transform:translateY(-1px)}.test strong{display:block;font-size:14px;margin:5px 0 8px}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:11px}.tag{background:#eef2ee;color:#5b715f;border-radius:20px;padding:4px 8px}.empty{background:#fff;border:1px dashed #d9ddd6;border-radius:15px;padding:30px;text-align:center;color:#727970;line-height:1.7;grid-column:1/-1}.empty strong{display:block;color:#39433b;margin-bottom:5px}.footer{text-align:center;color:#999b93;font-size:11px;margin-top:28px}
@media(max-width:720px){.wrap{padding:18px 14px 45px}.hero{padding:23px}.parts{grid-template-columns:repeat(2,1fr)}.list{grid-template-columns:1fr}.top{margin-bottom:20px}.section p{display:none}}
</style>
</head>
<body><main class="wrap">
<header class="top"><a class="brand" href="../"><span class="mark">I.</span><span><strong>IELTS STUDIO</strong><small>PERSONAL LEARNING HUB</small></span></a><a class="back" href="../">← 返回学习总览</a></header>
<section class="hero"><div class="eyebrow">LISTENING PRACTICE SPACE</div><h1>Listening Studio</h1><p>选择考试部分，筛选题目频率，打开原始练习页面完成听力。题目页面会保留对应的音频、题型和原有判分方式。</p><div class="stats"><div class="stat"><strong>147</strong><span>套听力练习</span></div><div class="stat"><strong>4</strong><span>个考试部分</span></div><div class="stat"><strong>146</strong><span>份配套 PDF</span></div></div></section>
<div class="section"><h2>选择练习部分</h2><p>点击 Part 切换题目列表</p></div>
<section class="parts" id="parts">
<button class="part" data-part="P1" aria-pressed="true"><div class="num">PART 01</div><strong>38 套</strong><span>日常对话 / 信息填空</span></button>
<button class="part" data-part="P2" aria-pressed="false"><div class="num">PART 02</div><strong>24 套</strong><span>独白 / 选择与匹配</span></button>
<button class="part" data-part="P3" aria-pressed="false"><div class="num">PART 03</div><strong>35 套</strong><span>学术讨论 / 多题型</span></button>
<button class="part" data-part="P4" aria-pressed="false"><div class="num">PART 04</div><strong>50 套</strong><span>学术讲座 / 长篇独白</span></button>
</section>
<div class="section"><h2 id="listTitle">Part 1 题目</h2><p id="resultCount">正在读取题库目录…</p></div>
<section class="toolbar"><input id="search" class="search" type="search" placeholder="搜索题目名称…" aria-label="搜索题目名称"><div class="filters" id="filters"><button class="filter" data-frequency="全部" aria-pressed="true">全部</button><button class="filter" data-frequency="高频" aria-pressed="false">高频</button><button class="filter" data-frequency="次高频" aria-pressed="false">次高频</button><button class="filter" data-frequency="非高频" aria-pressed="false">非高频</button></div></section>
<section class="list" id="testList" aria-live="polite"><div class="empty"><strong>正在加载题库</strong>请稍候…</div></section>
<div class="footer">IELTS Studio · Listening module · Personal learning workspace</div>
</main>
<script src="app.js"></script>
</body></html>
